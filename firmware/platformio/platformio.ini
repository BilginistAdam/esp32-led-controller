; ESP32-C3 LED Strip Controller - standalone firmware
; Build:  pio run            Upload (USB-C):  pio run -t upload
; Monitor: pio device monitor

[env:ledctl]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1          ; ESP32-C3-WROOM-02-N4 (4 MB flash)
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv   ; room for OTA
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1      ; Serial over the native USB-C port
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    tzapu/WiFiManager@2.0.17
    bblanchon/ArduinoJson@7.2.1

; Optional: OTA upload after first flash
; upload_protocol = espota
; upload_port = led-ctrl.local
