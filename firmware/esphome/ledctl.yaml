# ESPHome config - ESP32-C3 LED strip controller (rev A)
esphome:
  name: led-ctrl
  friendly_name: LED Kontrol

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG   # logs over the USB-C port

api:            # Home Assistant
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}        # fallback hotspot if WiFi fails
captive_portal:
web_server:     # http://led-ctrl.local

output:
  - platform: ledc
    id: strip_pwm
    pin: GPIO4            # -> R5 -> Q1 gate
    frequency: 20000Hz    # above audible range

light:
  - platform: monochromatic
    id: strip
    name: "LED Serit"
    output: strip_pwm
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 300ms

binary_sensor:
  - platform: gpio
    name: "Buton"
    pin:
      number: GPIO9       # BOOT button, free to use after boot
      inverted: true
      ignore_strapping_warning: true
    filters:
      - delayed_on: 30ms
    on_press:
      - light.toggle: strip

status_led:
  pin: GPIO10             # green LED D4
